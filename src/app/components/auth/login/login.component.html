<div
  class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8
         bg-gray-50 text-gray-900
         dark:bg-gray-900 dark:text-gray-100"
>
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img
      src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500"
      alt="Your Company"
      class="mx-auto h-10 w-auto"
    />

    <h2
      class="mt-10 text-center text-2xl/9 font-bold tracking-tight
             text-gray-900
             dark:text-white"
    >
      Sign in to your account
    </h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <form class="space-y-6">
      <!-- Email -->
      <div>
        <label
          for="email"
          class="block text-sm/6 font-medium
                 text-gray-700
                 dark:text-gray-100"
        >
          Email address
        </label>

        <div class="mt-2">
          <input
            id="email"
            type="email"
            required
            class="block w-full rounded-md px-3 py-1.5 text-base
                   bg-white text-gray-900
                   outline outline-1 outline-gray-300
                   placeholder:text-gray-400
                   focus:outline-2 focus:outline-indigo-500
                   dark:bg-gray-800 dark:text-white
                   dark:outline-gray-700 dark:placeholder:text-gray-500
                   sm:text-sm/6"
          />
        </div>
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between">
          <label
            for="password"
            class="block text-sm/6 font-medium
                   text-gray-700
                   dark:text-gray-100"
          >
            Password
          </label>

          <div class="text-sm">
            <a
              href="#"
              class="font-semibold
                     text-indigo-600 hover:text-indigo-500
                     dark:text-indigo-400 dark:hover:text-indigo-300"
            >
              Forgot password?
            </a>
          </div>
        </div>

        <div class="mt-2">
          <input
            id="password"
            type="password"
            required
            class="block w-full rounded-md px-3 py-1.5 text-base
                   bg-white text-gray-900
                   outline outline-1 outline-gray-300
                   placeholder:text-gray-400
                   focus:outline-2 focus:outline-indigo-500
                   dark:bg-gray-800 dark:text-white
                   dark:outline-gray-700 dark:placeholder:text-gray-500
                   sm:text-sm/6"
          />
        </div>
      </div>

      <!-- Button -->
      <div>
        <button
          type="submit"
          class="flex w-full justify-center rounded-md px-3 py-1.5
                 text-sm/6 font-semibold text-white
                 bg-indigo-600 hover:bg-indigo-500
                 focus-visible:outline-2 focus-visible:outline-offset-2
                 focus-visible:outline-indigo-600"
        >
          Sign in
        </button>
      </div>
    </form>

    <!-- Footer -->
    <p
      class="mt-10 text-center text-sm/6
             text-gray-500
             dark:text-gray-400"
    >
      Not a member?
      <a
        href="#"
        class="font-semibold
               text-indigo-600 hover:text-indigo-500
               dark:text-indigo-400 dark:hover:text-indigo-300"
      >
        <a routerLink="/signup">SignUp here.</a>
      </a>
    </p>
  </div>
</div>
